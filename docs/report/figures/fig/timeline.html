<html><head><link rel="stylesheet" href="base.css"><style>
body{width:1100px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{border:1px solid #ddd; padding:6px 6px; text-align:center}
th{background:#f1f1ee} td.name{text-align:left; width:300px}
.d{background:#1f5f4a} .p{background:repeating-linear-gradient(45deg,#c7e3d6,#c7e3d6 6px,#eef5f1 6px,#eef5f1 12px)}
.legend{margin-top:12px; font-size:13px; display:flex; gap:24px}
.sw{display:inline-block; width:16px; height:12px; vertical-align:-1px; margin-right:6px; border:1px solid #ccc}
</style></head><body>
<div class="title">Semester 2 development timeline (weeks 1–14)</div>
<table id="t"></table>
<div class="legend"><span><span class="sw d"></span>completed</span><span><span class="sw p"></span>planned</span><span>Report Part I due: week 5</span></div>
<script>
const rows=[
["Knowledge-base dataset preparation (law text → JSONL)",[1,2,3],"d"],
["Environment setup and data verification",[4],"d"],
["Knowledge base: schema, loading, chunking",[4],"d"],
["Semantic retrieval + evaluation",[4],"d"],
["Analysis pipeline: masking, RAG, LLM, calculator",[4,5],"d"],
["Blind testing and fixes",[5],"d"],
["Web interface (prototype)",[5],"d"],
["Accounts, My Cases, documents/OCR, claim, PDF/Word",[5],"d"],
["Report Part I",[5],"d"],
["Violations table OCR + KB backup (SR5)",[6,7],"p"],
["Judicial decisions dataset + retrieval (FR7)",[6,7,8,9],"p"],
["Knowledge-base management UI (FR15)",[9,10],"p"],
["UI/UX redesign",[8,9,10,11],"p"],
["Evaluation with held-out cases + legal reviewer",[10,11,12],"p"],
["Performance/load testing + deployment",[11,12],"p"],
["Final report and presentation",[13,14],"p"]];
let h="<tr><th>Activity</th>"+Array.from({length:14},(_,i)=>`<th>${i+1}</th>`).join("")+"</tr>";
rows.forEach(([n,w,c])=>{h+=`<tr><td class="name">${n}</td>`+Array.from({length:14},(_,i)=>`<td class="${w.includes(i+1)?c:""}"></td>`).join("")+"</tr>";});
document.getElementById("t").innerHTML=h;
</script></body></html>
