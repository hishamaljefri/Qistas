<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Rendering only: Times New Roman is not installed here; use the metric-compatible Liberation Serif
       for Latin text and Noto Naskh Arabic for Arabic text (in Word, Times New Roman covers both). -->
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
</fontconfig>
