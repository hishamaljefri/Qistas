[project]
name = "qistas-backend"
version = "0.1.0"
description = "QISTAS: Arabic legal assistant for Saudi labor law (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyarabic>=0.6.15",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
